<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Halo ×16 · ensaio de 5 Gyr</title><style>body{font:16px/1.6 system-ui;background:#0b171b;color:#e1eded;max-width:1050px;margin:35px}button{padding:12px 20px}pre{white-space:pre-wrap}</style><h1>Halo ×16 — 5.000 Myr</h1><p>Disco e bojo da sessão original preservados. Massas físicas constantes. Critério solicitado: h50(5 Gyr) ≤ 2 h50(0). O maior crescimento amostrado também é registrado. O controle suave não conta como aprovação de uma galáxia viva.</p><button id="run">Executar refinamento</button><button id="cancel" disabled>Cancelar com preservação</button><p id="status" role="status">Aguardando.</p><pre id="result"></pre><script type="module">let worker;const $=id=>document.getElementById(id);$('run').onclick=()=>{$('run').disabled=true;$('cancel').disabled=false;$('result').textContent='';worker=new Worker('./browser-halo-5gyr-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')$('status').textContent=data.text;else{$('status').textContent=data.type==='failed'?'Falha no teste':'Etapa concluída';$('result').textContent=JSON.stringify(data,null,2);$('run').disabled=false;$('cancel').disabled=true;worker.terminate();}};worker.onerror=e=>{$('status').textContent=e.message;$('run').disabled=false;$('cancel').disabled=true;};worker.postMessage({type:'run',onlyRunId:'halo-x16'});};$('cancel').onclick=()=>{worker.postMessage({type:'cancel'});$('cancel').disabled=true;$('status').textContent='Cancelamento solicitado; aguardando o lote GPU atual.';};</script></html>
