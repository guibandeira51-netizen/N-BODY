<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>GPU — auditoria CPU</title><style>body{background:#102127;color:#d2e1e6;font:15px/1.6 system-ui;max-width:1100px;margin:35px auto;padding:20px}button{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>RX 7600 — controle de desempenho</h1><p>Mesmo modelo e semente, precisão Float32 própria do backend GPU. N = 10.000, 80.000 e 536.000 (N₀ = 40.000, halo ×32). Referência direta Float64 em 96 alvos do estado GPU.</p><button id="run">Executar GPU</button><p id="status">Pronto.</p><pre id="results">[]</pre><script type="module">const button=document.querySelector('#run');button.onclick=()=>{button.disabled=true;document.querySelector('#status').textContent='Calculando três resoluções…';const worker=new Worker('./browser-gpu-cpu-audit-worker.mjs',{type:'module'});worker.onmessage=({data})=>{document.querySelector('#results').textContent=JSON.stringify(data,null,2);document.querySelector('#status').textContent=data.type==='error'?'Falha: '+data.message:'Concluído.';worker.terminate();button.disabled=false;};worker.onerror=e=>{document.querySelector('#status').textContent=e.message;worker.terminate();button.disabled=false;};worker.postMessage({});};</script></html>
