<!doctype html><meta charset="utf-8"><title>Validação dos diagnósticos observacionais</title><style>body{font:15px system-ui;background:#102127;color:#dce8ec;padding:25px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Sondas passivas: validação independente</h1><button id="run">Executar validação GPU</button><p id="status">Pronto</p><pre id="result"></pre><script type="module">const run=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');run.onclick=()=>{run.disabled=true;const worker=new Worker('./browser-test-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')status.textContent=data.message;else{status.textContent=data.type==='result'?'Concluído':'Falha';result.textContent=JSON.stringify(data,null,2);worker.terminate();run.disabled=false;}};worker.postMessage({run:true});};</script>
