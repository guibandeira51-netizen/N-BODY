<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Soma direta · validação na resolução refinada</title><h1>Comparação na resolução real do halo refinado</h1><button id="run">Validar o estado real do halo ×16</button><pre id="status">Aguardando.</pre><script type="module">
import {GPUBackend} from '../src/compute/gpu.js';import {GPUChunkedDirectBackend} from '../src/compute/gpu-chunked-direct.js';import {unpackCheckpoint} from '../scripts/halo-5gyr/checkpoint.js';
const $=id=>document.getElementById(id);$('run').onclick=async()=>{let engine;try{$('run').disabled=true;const m=await(await fetch('../reports/halo-5gyr/manifest.json')).json(),config=m.runs.find(r=>r.id==='halo-x16'),response=await fetch('../'+config.file),bytes=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(),{state}=unpackCheckpoint(bytes);let reference;const comparison={};for(const [name,Type]of [['original',GPUBackend],['chunked',GPUChunkedDirectBackend]]){$('status').textContent='Calculando '+name+' em N='+state.n;engine=await Type.create();await engine.initialize(state,{dt:.1,epsilon:.1});const initial=await engine.snapshot();await engine.step(2);const final=await engine.snapshot();if(name==='original')reference={initial,final};else for(const epoch of ['initial','final']){comparison[epoch]={};for(const key of ['positions','velocities','masses','accelerations']){let unequal=0,maxAbsolute=0;const actual=(epoch==='initial'?initial:final)[key],expected=reference[epoch][key];for(let i=0;i<actual.length;i++){if(actual[i]!==expected[i])unequal++;maxAbsolute=Math.max(maxAbsolute,Math.abs(actual[i]-expected[i]));}comparison[epoch][key]={unequal,maxAbsolute};}}engine.dispose();engine=null;}$('status').textContent=JSON.stringify({schema:'direct-target-chunk-large-v1',createdUTC:new Date().toISOString(),n:state.n,counts:config.counts,inputSHA256:config.sha256,steps:2,comparison,bitwiseEqual:Object.values(comparison).every(e=>Object.values(e).every(v=>v.unequal===0)),qualification:'Actual refined initial state, original direct versus target-chunked direct GPU forces and two full KDK steps. No force approximation or altered physical parameters.'},null,2);}catch(e){$('status').textContent=e.stack??e.message;}finally{engine?.dispose();$('run').disabled=false;}};</script></html>
