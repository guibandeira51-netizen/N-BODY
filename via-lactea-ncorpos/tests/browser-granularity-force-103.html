const $=id=>document.getElementById(id),norm=a=>Math.hypot(...a),quantile=(a,q)=>a.slice().sort((a,b)=>a-b)[Math.floor((a.length-1)*q)],hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
$('run').onclick=async()=>{let g;try{$('run').disabled=true;const[t,v]=await Promise.all(['halo-fixed-grid.json','halo-grid-validation.json'].map(p=>fetch('../reports/v1.0.3/'+p).then(r=>r.json()))),points=[...v.points,...v.discPoints],truth=[...v.referenceForce,...v.discNative],n=points.length,s={n,time:0,positions:Float64Array.from(points.flat()),velocities:new Float64Array(3*n),accelerations:new Float64Array(3*n),masses:new Float64Array(n).fill(1e-25),components:new Uint8Array(n),meta:{physicalModel:{id:t.modelId}}};g=await GPUExternalGridBackend.create();await g.initialize(s,{dt:.05,epsilon:.1,externalGrid:t});const q=await g.snapshot(),errs=[],cpuErrors=[],discErrors=[];for(let i=0;i<n;i++){const a=Array.from(q.accelerations.subarray(3*i,3*i+3)),ref=truth[i],den=norm(ref),r=norm(a.map((x,k)=>x-ref[k]))/den;errs.push(r);const b=externalGridAt(t,...points[i]).acceleration;cpuErrors.push(norm(a.map((x,k)=>x-b[k]))/Math.max(norm(b),1e-30));if(norm(points[i])<=30)discErrors.push(r);}const summary={status:'measured',n,fieldGridSHA256:await hash(await(await fetch('../reports/v1.0.3/halo-fixed-grid.json')).arrayBuffer()),globalRelativeQuantiles50_90_99_Max:[.5,.9,.99,1].map(x=>quantile(errs,x)),inside30kpcRelativeQuantiles50_90_99_Max:[.5,.9,.99,1].map(x=>quantile(discErrors,x)),GPUvsCPUGridRelativeQuantiles50_90_99_Max:[.5,.9,.99,1].map(x=>quantile(cpuErrors,x)),scope:'Actual WGSL on device; near-zero tracer masses make self gravity negligible. Reference native Plummer halo. No trajectory/DF modification.'};$('summary').textContent=JSON.stringify(summary,null,2);$('result').textContent=JSON.stringify({...summary,points,reference:truth,gpuAccelerations:Array.from(q.accelerations),relativeErrors:errs},null,2);$('status').textContent='Medição concluída; avaliar erros antes dos controles B.';}catch(e){$('status').textContent=e.message;}finally{g?.dispose();$('run').disabled=false;}};
