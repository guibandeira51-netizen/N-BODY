<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação física 1.0 — campanha</title>
<h1>Campanha de equilíbrio — versão 1.0 em avaliação</h1><p>Ensaios reais. Cada execução é independente; resultados parciais não contam como concluídos.</p>
<label>Ensaio <select id="case"></select></label><button id="run">Executar ensaio</button><p id="status" role="status">Carregando protocolo…</p><pre id="output">{}</pre>
<script type="module">
import {GPUBackend} from '../src/compute/gpu.js';
import {GPUExternalGridBackend} from '../src/compute/gpu-external-grid.js';
import {createGalaxy} from '../src/physics/initial.js';
import {createHaloExperiment} from '../src/physics/halo-experiments.js';
import {equilibriumSample,ringMembership} from '../src/physics/equilibrium-analysis.js';
import {diagnostics} from '../src/physics/diagnostics.js';
import {externalGridDiagnostics} from '../src/physics/external-grid.js';
import {G} from '../src/physics/constants.js';
import {barnesHutAccelerations} from '../src/physics/forces.js';
const $=id=>document.getElementById(id),hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join(''),yieldUI=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>{c.port1.close();c.port2.close();r();};c.port2.postMessage(0);});
const protocol=await(await fetch('../scripts/equilibrium/protocol-calibrated.json')).json();
for(const [i,c] of protocol.runs.entries()){const o=document.createElement('option');o.value=i;o.textContent=`${c.id} · ${c.duration} Myr`;$('case').append(o);}
$('status').textContent='Pronto. Protocolo carregado; candidato ainda não validado.';
function frozenBaryons(s){const n=s.components.filter(c=>c!==2).length;return {n,positions:s.positions.slice(0,3*n),velocities:s.velocities.slice(0,3*n),masses:s.masses.slice(0,n),components:s.components.slice(0,n),accelerations:new Float64Array(3*n),time:0,meta:{...structuredClone(s.meta),haloMode:'fixed',counts:[s.meta.counts[0],s.meta.counts[1],0]}};}
function compact(a,full){return {...a,structure:{...a.structure,components:a.structure.components.map(c=>({...c,profiles:full?c.profiles:undefined,percentiles:full?c.percentiles:undefined}))}};}
function fieldErrors(s,gpu,epsilon){
 const ids=Array.from({length:128},(_,j)=>Math.floor(j*(s.n-1)/127)),ref=[],bh=[];const b={...s,accelerations:new Float64Array(3*s.n)};barnesHutAccelerations(b,{epsilon,theta:.5});
 for(const i of ids){const k=3*i,a=[0,0,0];for(let j=0;j<s.n;j++)if(j!==i){const l=3*j,dx=s.positions[l]-s.positions[k],dy=s.positions[l+1]-s.positions[k+1],dz=s.positions[l+2]-s.positions[k+2],r2=dx*dx+dy*dy+dz*dz+epsilon*epsilon,f=G*s.masses[j]/(r2*Math.sqrt(r2));a[0]+=f*dx;a[1]+=f*dy;a[2]+=f*dz;}ref.push(a);bh.push(Array.from(b.accelerations.subarray(k,k+3)));}
 const score=values=>{let err=0,den=0,max=0;for(let j=0;j<ids.length;j++){const a=values[j],r=ref[j],e=Math.hypot(...a.map((x,k)=>x-r[k])),n=Math.hypot(...r);err+=e*e;den+=n*n;max=Math.max(max,e/Math.max(n,1e-30));}return {rmsRelative:Math.sqrt(err/den),maxPointRelative:max};};
 const f32=score(ids.map(i=>Array.from(gpu.accelerations.subarray(3*i,3*i+3)))),thetaHalf=score(bh);barnesHutAccelerations(b,{epsilon,theta:.25});return {targetCount:ids.length,targetIndices:ids,reference:'exact Plummer summation f64, identical source arrays before GPU upload',gpuF32:f32,barnesHutTheta05:thetaHalf,barnesHutTheta025:score(ids.map(i=>Array.from(b.accelerations.subarray(3*i,3*i+3))))};
}
$('run').onclick=async()=>{
 $('run').disabled=true;$('case').disabled=true;let gpu;const c={...protocol.default,...protocol.runs[Number($('case').value)]},report={schema:'equilibrium-run-v1',id:c.id,config:c,startedUTC:new Date().toISOString(),status:'running',samples:[],particleStates:[],sourceHashes:{}};
 try{
  for(const path of ['src/physics/constants.js','src/physics/models.js','src/physics/initial.js','src/physics/initial-legacy.js','src/physics/initial-allocated.js','src/physics/halo-experiments.js','src/physics/forces.js','src/physics/integrator.js','src/physics/snapshot-model.js','src/physics/mass-audit.js','src/physics/equilibrium-analysis.js','src/physics/structure-diagnostics.js','src/physics/disk-analysis.js','src/physics/external-grid.js','src/compute/gpu.js','src/compute/gpu-external-grid.js','tests/browser-equilibrium-calibrated-v1.html','scripts/equilibrium/protocol-calibrated.json']){const r=await fetch('../'+path);if(!r.ok)throw Error('Fonte ausente: '+path);report.sourceHashes[path]=await hash(await r.arrayBuffer());}
  for(const path of ['src/physics/laboratory.js','src/physics/iterative-initial.js','src/physics/jeans-axisymmetric.js']){const r=await fetch('../'+path);if(!r.ok)throw Error('Fonte ausente: '+path);report.sourceHashes[path]=await hash(await r.arrayBuffer());}
  let initial;
  if(c.kind==='legacy')initial=createHaloExperiment({baseN:c.n,baryonSeed:c.seed,haloSeed:c.seed,haloCount:Math.round(c.n*.4),haloMode:'live'});
  else{const id=`c20-agama-n${c.nb+c.nd+c.nh}-nb${c.nb}-nd${c.nd}-nh${c.nh}-s${c.seed}-h${c.haloSeed}`,path=`../reports/v1.0.0/agama-calibrated/${id}${c.kind==='gaussian-control'?'-gaussian':''}.json`,r=await fetch(path);if(!r.ok)throw Error('Snapshot não disponível: '+path);const bytes=await r.arrayBuffer();report.snapshotSHA256=await hash(bytes);initial=createGalaxy({initialization:'snapshot',snapshot:JSON.parse(new TextDecoder().decode(bytes))});}
  let grid=null;if(c.haloMode==='fixed-axisymmetric'){const r=await fetch('../reports/v1.0.0/agama-calibrated/halo-fixed-grid.json');if(!r.ok)throw Error('Tabela convergida de halo ausente.');const b=await r.arrayBuffer();report.externalGridSHA256=await hash(b);grid=JSON.parse(new TextDecoder().decode(b));initial=frozenBaryons(initial);}
  report.initialMeta=initial.meta;report.initialHashes={positions:await hash(initial.positions.buffer),velocities:await hash(initial.velocities.buffer),masses:await hash(initial.masses.buffer),stellarPositions:await hash(initial.positions.slice(0,3*(initial.meta.counts[0]+initial.meta.counts[1])).buffer),stellarVelocities:await hash(initial.velocities.slice(0,3*(initial.meta.counts[0]+initial.meta.counts[1])).buffer)};
  const cohorts=ringMembership(initial);gpu=await(grid?GPUExternalGridBackend:GPUBackend).create();await gpu.initialize(initial,{...c,externalGrid:grid});let ref=null,wall=performance.now();
  for(let t=0;t<=c.duration;t+=c.cadenceMyr){
   $('status').textContent=`${c.id}: t=${t}/${c.duration} Myr · N=${initial.n} · KDK GPU f32`;
   if(t)await gpu.step(Math.round(c.cadenceMyr/c.dt));const s=await gpu.snapshot();s.time=t;
   if(t===0&&!grid)report.initialField=fieldErrors(initial,s,c.epsilon);
   const opts={algorithm:'barnes-hut',theta:c.theta,epsilon:c.epsilon},d=grid?externalGridDiagnostics(s,opts,grid):diagnostics(s,opts);ref??=d;
   const checkpoint=[0,20,200,1000].includes(t),a=equilibriumSample(s,{options:opts,diagnostic:d,baseline:ref,initialMembership:cohorts});report.samples.push(compact(a,checkpoint));report.lastTimeMyr=t;report.wallMs=performance.now()-wall;
   if(checkpoint){report.particleConstants??={n:s.n,masses:Array.from(s.masses),components:Array.from(s.components),units:'kpc,Myr,1e10 nominal Msun',precision:'GPU f32 read back into f64 arrays',meta:s.meta};report.particleStates.push({timeMyr:t,positions:Array.from(s.positions),velocities:Array.from(s.velocities),accelerations:Array.from(s.accelerations)});$('output').textContent=JSON.stringify(report);}await yieldUI();
  }
  report.status='completed';report.completedUTC=new Date().toISOString();$('status').textContent=`Concluído: ${c.id}, ${c.duration} Myr. Resultado medido; sem certificação automática.`;
 }catch(e){report.status='failed';report.error=e.stack;$('status').textContent=`Falha: ${e.message}`;}
 finally{gpu?.dispose();$('output').textContent=JSON.stringify(report);$('run').disabled=false;$('case').disabled=false;}
};
</script></html>
