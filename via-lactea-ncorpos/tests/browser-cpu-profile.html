<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Auditoria de desempenho CPU</title><style>body{background:#102127;color:#d2e1e6;font:15px/1.6 system-ui;max-width:1100px;margin:35px auto;padding:20px}button{padding:12px;margin:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #49616c}</style><h1>Auditoria CPU — Barnes–Hut Float64</h1><p>Teste isolado. Não altera o simulador aberto. Compara quatro passos completos a partir dos mesmos arrays; primeiro passo é aquecimento. Protótipo de Workers separado do motor principal.</p><button id="run">Executar N = 10.000 e 80.000</button><p id="status">Pronto.</p><table><thead><tr><th>N</th><th>Motor</th><th>ms/passo</th><th>Ganho</th><th>Concordância</th></tr></thead><tbody id="summary"></tbody></table><details><summary>JSON dos resultados medidos</summary><pre id="results">[]</pre></details><script type="module">
const results=[],button=document.querySelector('#run'),status=document.querySelector('#status'),out=document.querySelector('#results'),table=document.querySelector('#summary');
button.onclick=async()=>{button.disabled=true;results.length=0;table.textContent='';try{for(const n of [10000,80000]){status.textContent='Medindo N='+n+'; aguarde os passos completos.';const worker=new Worker('./browser-cpu-profile-worker.mjs',{type:'module'});let r;try{r=await new Promise((resolve,reject)=>{worker.onmessage=({data})=>data.type==='error'?reject(Error(data.message)):resolve(data.result);worker.onerror=e=>reject(Error(e.message));worker.postMessage({n});});}finally{worker.terminate();}results.push(r);out.textContent=JSON.stringify(results,null,2);for(const s of [{workers:1,medianStepMs:r.serial.medianStepMs,speedup:1},...r.parallel]){const row=document.createElement('tr');for(const v of [n,s.workers===1?'Original serial':s.workers+' Workers + SAB',s.medianStepMs.toFixed(3),s.speedup.toFixed(2)+'×',s.workers===1?'Referência':'Bit a bit']){const cell=document.createElement('td');cell.textContent=v;row.append(cell);}table.append(row);}}status.textContent='Concluído. Resultados reais, sem extrapolação de N.';}catch(error){status.textContent='Falha: '+error.message;}finally{button.disabled=false;}};
</script></html>
