<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação de soma direta por blocos</title><h1>Validação de dispatches diretos por blocos</h1><button id="run">Comparar soma direta original e por blocos</button><pre id="status">Aguardando.</pre><script type="module">
import {GPUBackend} from '../src/compute/gpu.js';import {GPUChunkedDirectBackend} from '../src/compute/gpu-chunked-direct.js';import {createGalaxy} from '../src/physics/initial.js';
const $=id=>document.getElementById(id);$('run').onclick=async()=>{let engine;try{$('run').disabled=true;const runs=[];for(const n of [256,8193,16384]){let reference;const s=createGalaxy({n,seed:2026});for(const [name,Type]of [['original',GPUBackend],['chunked',GPUChunkedDirectBackend]]){engine=await Type.create();await engine.initialize(s,{dt:.1,epsilon:.1});const initial=await engine.snapshot();await engine.step(20);const final=await engine.snapshot();if(name==='original')reference={initial,final};else{const comparison={};for(const epoch of ['initial','final']){comparison[epoch]={};for(const key of ['positions','velocities','masses','accelerations']){let max=0,bad=0;for(let i=0;i<final[key].length;i++){const a=(epoch==='initial'?initial:final)[key][i],b=reference[epoch][key][i];if(a!==b)bad++;max=Math.max(max,Math.abs(a-b));}comparison[epoch][key]={unequal:bad,maxAbsolute:max};}}runs.push({n,steps:20,time:final.time,comparison});}engine.dispose();engine=null;}$('status').textContent='Verificados '+n+' corpos.';}const evidence={schema:'direct-target-chunk-validation-v1',createdUTC:new Date().toISOString(),runs,bitwiseEqual:runs.every(r=>Object.values(r.comparison).every(e=>Object.values(e).every(v=>v.unequal===0))),qualification:'Original versus chunked direct GPU Plummer forces and KDK trajectories; same input states, G, epsilon and per-particle source ordering. Not a structural-equilibrium test.'};localStorage.setItem('halo-chunk-validation',JSON.stringify(evidence));$('status').textContent=JSON.stringify(evidence,null,2);}catch(e){$('status').textContent=e.stack??e.message;}finally{engine?.dispose();$('run').disabled=false;}};</script></html>
