<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Diagnóstico de resolução · controles</title><style>body{background:#10191c;color:#d8e8e9;font:16px system-ui;margin:36px;max-width:960px}button{padding:12px 20px}pre{white-space:pre-wrap}</style><h1>Diagnóstico de resolução</h1><p>Geradores existentes, massas físicas preservadas. Refinamentos independentes do disco e do halo; 40 e 200 Myr. Não altera a execução principal.</p><button id="run">Executar campanha</button><button id="cancel" disabled>Cancelar campanha</button><p role="status" id="status">Aguardando execução.</p><pre id="result"></pre><script type="module">
let worker;const $=id=>document.getElementById(id);$('run').onclick=()=>{$('run').disabled=true;$('cancel').disabled=false;worker=new Worker('./browser-resolution-decision-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')$('status').textContent=data.text;else{$('status').textContent=data.type==='finished'?'Campanha concluída; evidências preservadas localmente.':'Falha: '+data.reason;$('result').textContent=JSON.stringify(data,null,2);$('run').disabled=false;$('cancel').disabled=true;worker.terminate();}};worker.onerror=e=>{$('status').textContent='Erro: '+e.message;$('cancel').disabled=true;};worker.postMessage({type:'run'});};$('cancel').onclick=()=>{worker?.terminate();$('status').textContent='Cancelada. Somente execuções concluídas já salvas são evidências.';$('run').disabled=false;$('cancel').disabled=true;};</script></html>
