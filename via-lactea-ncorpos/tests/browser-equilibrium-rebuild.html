<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Candidato orbital · validação de precisão</title><style>body{background:#10191c;color:#d8e8e9;font:16px system-ui;margin:36px;max-width:1050px}button{padding:12px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%}</style><h1>Candidato orbital — ensaios reais CPU/GPU</h1><p>Snapshot offline, sem otimização no navegador. Comparação curta com os mesmos valores Float32 e três sementes com halo refinado. Nenhum resultado certifica equilíbrio.</p><button id="run">Executar ensaios</button><button id="cancel" disabled>Cancelar ensaios</button><button id="save-json" disabled>Salvar evidência JSON</button><p id="status" role="status">Aguardando execução.</p><pre id="result"></pre><script type="module">
let worker,evidence;const $=id=>document.getElementById(id);$('run').onclick=()=>{worker?.terminate();$('run').disabled=true;$('cancel').disabled=false;worker=new Worker('./browser-equilibrium-rebuild-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')$('status').textContent=data.text;else{evidence=data;$('save-json').disabled=false;$('result').textContent=JSON.stringify({type:data.type,reason:data.reason,runs:data.runs?.map(r=>({config:r.config,wallMs:r.wallMs,h0:r.samples[0].disk.instant.h50,hFinal:r.samples.at(-1).disk.instant.h50,maxEnergyPercent:Math.max(...r.samples.map(s=>s.energyError.absolute*100))}))},null,2);if(data.type==='result'&&location.hostname==='localhost'&&location.port==='4180')fetch('http://127.0.0.1:4188/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>{if(!r.ok)throw Error('Coleta local indisponível');return r.json();}).then(saved=>{$('status').textContent='Ensaios concluídos e evidência salva: '+saved.file;}).catch(e=>{$('status').textContent='Ensaios concluídos; falha ao salvar: '+e.message;});$('status').textContent=data.type==='result'?'Ensaios concluídos.':'Ensaio indisponível ou falhou.';$('run').disabled=false;$('cancel').disabled=true;worker.terminate();}};worker.onerror=e=>{$('status').textContent=e.message;$('run').disabled=false;$('cancel').disabled=true;};worker.postMessage({type:'run'});};$('cancel').onclick=()=>{worker?.terminate();$('status').textContent='Ensaios cancelados; nenhum estado posterior foi inventado.';$('run').disabled=false;$('cancel').disabled=true;};
$('save-json').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(evidence)],{type:'application/json'}));a.download='candidato-orbital-gpu.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></html>
