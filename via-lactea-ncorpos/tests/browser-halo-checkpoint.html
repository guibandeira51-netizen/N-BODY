<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Regressão de checkpoint GPU</title><h1>Regressão de retomada GPU</h1><button id="run">Testar retomada sem alterar a trajetória</button><button id="save" disabled>Salvar evidência</button><pre id="status">Aguardando.</pre><script type="module">
import {GPUBackend} from '../src/compute/gpu.js';import {createGalaxy} from '../src/physics/initial.js';import {packCheckpoint,unpackCheckpoint} from '../scripts/halo-5gyr/checkpoint.js';let evidence;
const $=id=>document.getElementById(id);$('run').onclick=async()=>{let gpu;try{$('run').disabled=true;const initial=createGalaxy({n:256,seed:2026});gpu=await GPUBackend.create();await gpu.initialize(initial,{dt:.1,epsilon:.1});await gpu.step(10);const mid=await gpu.snapshot(),parameters=gpu.effectiveParameters,bytes=packCheckpoint(mid,{id:'checkpoint-regression',globalSteps:gpu.steps,parameters,velocityEpoch:'after final KDK kick',meta:mid.meta});await gpu.step(10);const uninterrupted=await gpu.snapshot();gpu.dispose();const cp=unpackCheckpoint(bytes);gpu=await GPUBackend.create();await gpu.initialize(cp.state,{dt:.1,epsilon:.1});gpu.initialTime=0;gpu.steps=cp.metadata.globalSteps;gpu.time=cp.state.time;await gpu.step(10);const resumed=await gpu.snapshot(),errors={};for(const key of ['positions','velocities','masses','accelerations'])errors[key]=Math.max(...resumed[key].map((x,i)=>Math.abs(x-uninterrupted[key][i])));evidence={schema:'halo-5gyr-checkpoint-regression-v1',n:256,dtRequested:.1,parameters,steps:20,timeUninterrupted:uninterrupted.time,timeResumed:resumed.time,maximumAbsoluteErrors:errors,bitwiseEqual:Object.values(errors).every(x=>x===0)&&resumed.time===uninterrupted.time,qualification:'Small actual GPU regression of synchronized KDK checkpoint resume, not a physical equilibrium test.'};$('status').textContent=JSON.stringify(evidence,null,2);$('save').disabled=false;}catch(e){$('status').textContent=e.stack??e.message;}finally{gpu?.dispose();$('run').disabled=false;}};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(evidence,null,2)],{type:'application/json'}));a.download='halo-checkpoint-regression.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></html>
