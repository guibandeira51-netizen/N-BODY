<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Auditoria do disco · CPU Float64 × GPU Float32</title><style>body{background:#10191c;color:#d8e8e9;font:16px system-ui;margin:36px;max-width:1000px}button{padding:12px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#7fd7d4}</style><h1>Auditoria do disco — comparação de precisão</h1><p>Mesmos estados iniciais Float32 lidos da GPU; referência CPU Float64 com G, dt e ε efetivos. Dois ensaios curtos, sem classificação de equilíbrio.</p><button id="run">Executar ensaios</button><button id="download" disabled>Salvar evidência JSON</button><p id="status" role="status">Aguardando execução.</p><pre id="result"></pre><script type="module">
let worker,result;const $=id=>document.getElementById(id);$('run').onclick=()=>{worker?.terminate();$('run').disabled=true;worker=new Worker('./browser-disk-audit-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')$('status').textContent=data.text;else{result=data;$('result').textContent=JSON.stringify(data,null,2);$('status').textContent=data.type==='result'?'Ensaios concluídos.':'Ensaio indisponível ou falhou.';$('download').disabled=false;$('run').disabled=false;worker.terminate();}};worker.onerror=e=>{$('status').textContent=e.message;$('run').disabled=false;};worker.postMessage({type:'run'});};$('download').onclick=()=>{const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));link.download='auditoria-disco-cpu-gpu.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);};
</script></html>
